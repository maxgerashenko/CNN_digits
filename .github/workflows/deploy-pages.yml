name: Test and deploy web app

# Tests and build run on every pull request and push that touch the web app,
# its training server test or this file, and on manual runs. The site is
# published to GitHub Pages only when someone starts this workflow by hand
# from main; a push or a pull request never publishes. Before the first
# publish, GitHub Pages must be switched on in the repository settings
# (Settings > Pages > Source: GitHub Actions) and the repository variable
# VITE_TRAINING_SERVER_URL (the address of the training server) must be set.

on:
  pull_request:
    paths:
      - 'web/**'
      - 'tests/training-server.test.mjs'
      - '.github/workflows/deploy-pages.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'tests/training-server.test.mjs'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

# Nothing is granted by default. Each job asks for what it needs.
permissions: {}

# One group per event and ref, so a pull request run never waits for, or is
# mixed with, a publish run. Runs in the same group queue; none is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Address of the training server (the Hugging Face Space). Set it as
          # a repository variable; empty means training is switched off.
          VITE_TRAINING_SERVER_URL: ${{ vars.VITE_TRAINING_SERVER_URL }}
      # The Pages artifact is made only for a manual run from main.
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        with:
          path: web/dist

  # Publishes the site. Skipped (not failed) on pull requests, pushes and
  # manual runs from any branch other than main.
  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
